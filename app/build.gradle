plugins {
    id 'com.android.application'
}

android {
    namespace 'com.rescuelink.app'
    compileSdk 36
    buildToolsVersion "36.1.0"

    defaultConfig {
        applicationId "com.irespons.redesign"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
        // WebRTC ships a ~12 MB native library per CPU type. Real phones are arm64 or armv7, so keep only those.
        // (An Intel/x86 emulator needs 'x86_64' added here.)
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }
        // Material and AndroidX ship dozens of translations the app does not use.
    }
    androidResources {
        localeFilters += ['en']
    }
    buildTypes {
        release {
            // Sign with the debug key so the release APK installs on a phone (an unsigned APK is refused)
            signingConfig signingConfigs.debug
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'org.osmdroid:osmdroid-android:6.1.18'
    // Free voice calls over the internet (WebRTC)
    implementation 'io.getstream:stream-webrtc-android:1.3.9'
}
